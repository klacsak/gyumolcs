:root {

* {

html,
body {

}

body {

}

.wrap {
  width: min(980px, 100%);
  margin: 0 auto;
}

header {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 24px;
}

.eyebrow {
  margin: 0 0 6px;

  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #4e8b51;
}

h1 {
  margin: 0;
  font-size: clamp(32px, 6vw, 52px);
  line-height: .98;
  letter-spacing: -.04em;
}

.subtitle {
  margin: 10px 0 0;
  color: light-dark(#607062, #b8c7b9);
  font-size: 16px;
}

.summary {
  min-width: 180px;
  padding: 18px;
  border: 1px solid light-dark(#d7e7d4, #304234);
  border-radius: 20px;
  background: light-dark(#ffffff, #202d23);
  text-align: right;
  box-shadow: 0 8px 28px #1c3b2010;
}

.count {
  font-size: 38px;
  font-weight: 900;
  line-height: 1;
}

.count-label {
  margin-top: 5px;
  color: light-dark(#6a7b6d, #aab9ad);
  font-size: 13px;
}

.progress {
  height: 9px;
  margin-top: 12px;
  overflow: hidden;
  border-radius: 999px;
  background: light-dark(#e1ecdf, #314033);
}

.progress > span {
  display: block;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: #63a95f;
  transition: width .25s ease;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 30px 0 14px;
}

h2 {
  margin: 0;
  font-size: 20px;
}

.hint {
  font-size: 13px;
  color: light-dark(#718073, #aab8ad);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
}

.fruit {
  appearance: none;
  border: 1px solid light-dark(#d8e7d5, #334536);
  background: light-dark(#fff, #202c23);
  color: inherit;
  border-radius: 22px;
  padding: 16px 12px 14px;
  cursor: pointer;
  text-align: center;
  box-shadow: 0 7px 22px #274f2510;
  transition:
    transform .15s ease,
    box-shadow .15s ease,
    border-color .15s ease;
}

.fruit:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 26px #274f2520;
}

.fruit:focus-visible {
  outline: 3px solid #8ac786;
  outline-offset: 2px;
}

.fruit.selected {
  border-color: #63a95f;
  box-shadow:
    0 0 0 3px #63a95f25,
    0 12px 28px #274f2520;
}

.emoji {
  width: 82px;
  height: 82px;
  margin: 0 auto 9px;
  display: grid;
  place-items: center;
  border-radius: 24px;
  background: light-dark(#f1f7ed, #29372c);
  font-size: 52px;
}

.name {
  font-weight: 800;
}

.meta {
  margin-top: 4px;
  min-height: 18px;
  font-size: 12px;
  color: light-dark(#758277, #adbaaf);
}

.badge {
  display: inline-grid;
  place-items: center;
  min-width: 25px;
  height: 25px;
  padding: 0 7px;
  margin-top: 9px;
  border-radius: 999px;
  background: light-dark(#e8f3e5, #304332);
  color: #4e8b51;
  font-size: 12px;
  font-weight: 900;
}

.actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 24px;
}

button.reset {
  border: 0;
  border-radius: 13px;
  padding: 11px 17px;
  background: light-dark(#e4ece2, #2d3b30);
  color: inherit;
  font-weight: 800;
  cursor: pointer;
}

button.reset:hover {
  filter: brightness(.97);
}

.note {
  margin-top: 18px;
  padding: 14px 16px;
  border-radius: 16px;
  background: light-dark(#edf6ea, #233127);
  color: light-dark(#58705b, #b9c7bb);
  font-size: 13px;
  line-height: 1.5;
}

@media (max-width: 620px) {
  .app {
    padding: 20px 14px 30px;
  }

  header {
    align-items: stretch;
    flex-direction: column;
  }

  .summary {
    text-align: left;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .fruit {
    padding: 12px 8px;
    border-radius: 18px;
  }

  .emoji {
    width: 68px;
    height: 68px;
    font-size: 43px;
    border-radius: 19px;
  }
}
</style>
